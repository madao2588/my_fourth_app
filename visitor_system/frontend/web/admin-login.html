<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisitorFlow | Admin Login</title>
  <link rel="icon" href="./public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles/main.css?v=20260421-brand-admin-shell-2">
</head>
<body>
  <div class="shell auth-shell">
    <main class="card auth-card">
      <p class="eyebrow">VisitorFlow / admin</p>
      <h1>进入访客预约系统管理端</h1>
      <p class="status-text subtle">
        使用管理员账号进入 admin 后台。访客预约与状态查询请前往 visitor 站点。
      </p>

      <form id="login-form" class="form" method="post" onsubmit="return false;">
        <label>
          <span>用户名</span>
          <input name="username" type="text" autocomplete="username" required>
        </label>
        <label>
          <span>密码</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="actions">
          <button id="login-submit-button" type="submit">登录</button>
          <a class="button-link ghost-link" href="./visitor.html">返回 visitor 访客站</a>
        </div>
      </form>

      <p id="login-result" class="status-text subtle">默认总指挥账号：madao / 666666</p>
    </main>
  </div>

  <script>
    (function preventNativeLoginNavigation() {
      const form = document.getElementById("login-form");
      if (!form) {
        return;
      }
      form.addEventListener(
        "submit",
        function preventDefaultSubmission(event) {
          event.preventDefault();
        },
        { capture: true },
      );
    })();
  </script>
  <script src="./src/runtime/registry.js?v=20260421-brand-admin-shell-2"></script>
  <script src="./public/runtime-config.js?v=20260421-brand-admin-shell-2"></script>
  <script src="./src/config/env.js?v=20260421-brand-admin-shell-2"></script>
  <script src="./src/services/api.js?v=20260421-brand-admin-shell-2"></script>
  <script src="./src/utils/shared.js?v=20260421-brand-admin-shell-2"></script>
  <script src="./src/pages/admin/login-page.js?v=20260421-brand-admin-shell-2"></script>
</body>
</html>
