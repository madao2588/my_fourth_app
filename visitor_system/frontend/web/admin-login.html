<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访客预约系统 - 管理员登录</title>
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
  <div class="shell auth-shell">
    <main class="card auth-card">
      <p class="eyebrow">管理员登录</p>
      <h1>进入管理后台</h1>
      <p class="status-text subtle">
        请先完成账号验证，验证成功后再进入管理后台。
      </p>

      <form id="login-form" class="form" method="post" onsubmit="return false;">
        <label>
          <span>用户名</span>
          <input name="username" type="text" autocomplete="username" required>
        </label>
        <label>
          <span>密码</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="actions">
          <button id="login-submit-button" type="submit">登录</button>
          <a class="button-link ghost-link" href="./index.html">返回入口页</a>
        </div>
      </form>

      <p id="login-result" class="status-text subtle">默认总指挥账号：madao / 666666</p>
    </main>
  </div>

  <script>
    (function preventNativeLoginNavigation() {
      const form = document.getElementById("login-form");
      if (!form) {
        return;
      }
      form.addEventListener(
        "submit",
        function preventDefaultSubmission(event) {
          event.preventDefault();
        },
        { capture: true },
      );
    })();
  </script>
  <script src="./src/runtime/registry.js"></script>
  <script src="./src/config/env.js"></script>
  <script src="./src/services/api.js"></script>
  <script src="./src/utils/shared.js"></script>
  <script src="./src/pages/admin/login-page.js"></script>
</body>
</html>
